[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-evidence-lint"
version = "0.1.0"
description = "Static lint for AI Skill SKILL.md files: detect English effect claims and verify in-context evidence references."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
skill-evidence-lint = "skill_evidence_lint.cli:app"

[project.urls]
Repository = "https://github.com/xiaohei52056/skill-evidence-lint"
Issues = "https://github.com/xiaohei52056/skill-evidence-lint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Calibration script is a standalone dev tool, not library code.
"calibration/**" = ["E402", "E501", "F401"]
