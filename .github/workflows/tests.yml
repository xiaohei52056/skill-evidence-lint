name: tests

on:
  push:
    branches: [main]
  pull_request:

# This workflow only checks out code and runs pytest/ruff; no write access needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Keep the matrix focused: Linux on both versions, macOS/Windows on 3.12.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -ra

      - name: Run ruff
        run: python -m ruff check .
