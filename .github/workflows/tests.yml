name: tests

on:
  push:
    branches: [main]
  pull_request:

# This workflow only checks out code and runs pytest/ruff; no write access needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Keep the matrix focused: Linux on both versions, macOS/Windows on 3.12.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -ra

      - name: Run ruff
        run: python -m ruff check .

      - name: Smoke-test installed JSON output contract
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/skill"
          cat > "$tmpdir/skill/SKILL.md" <<'EOF'
          # Demo

          We reduce latency by 40%, see [benchmark](benchmarks/latency.md).
          EOF
          # --format json must emit exactly one valid JSON document on stdout,
          # exit 0 even with advisory findings, and carry the v1 schema id.
          skill-evidence-lint --format json "$tmpdir/skill" > "$tmpdir/report.json"
          python -c "
          import json, sys
          # utf-8-sig tolerates a BOM if a runner shell layers one on output.
          with open(sys.argv[1], encoding='utf-8-sig') as fh:
              data = json.load(fh)
          assert data['schema'] == 'skill-evidence-lint.report.v1', data.get('schema')
          assert 'summary' in data and 'findings' in data and 'claims' in data
          print('json smoke ok; findings =', data['summary']['findings'])
          " "$tmpdir/report.json"
